backend:
  name: github
  repo: MyerzzD/astro-test-site
  branch: main

site_url: https://myerzzd.github.io/astro-test-site
display_url: https://myerzzd.github.io/astro-test-site

media_folder: public/uploads
public_folder: /astro-test-site/uploads

collections:
  - name: settings
    label: Site settings
    description: Business details, hero text, reviews and FAQs.
    files:
      - name: site
        label: Site settings
        file: src/data/site.json
        fields:
          - { name: name, label: Business name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: heroTitle, label: Homepage headline, widget: string }
          - { name: heroText, label: Homepage intro, widget: text }
          - { name: phone, label: Phone, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: address, label: Address, widget: string }
          - { name: trainer, label: Trainer name, widget: string }
          - { name: trainerBio, label: Trainer bio, widget: text }
          - name: stats
            label: Homepage stats
            widget: list
            fields:
              - { name: value, label: Number, widget: string }
              - { name: label, label: Label, widget: string }
          - name: testimonials
            label: Reviews
            widget: list
            summary: "{{fields.name}} — {{fields.dog}}"
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: name, label: Owner, widget: string, hint: "e.g. Hannah, Wisbech" }
              - { name: dog, label: Dog, widget: string, hint: "e.g. Biscuit the Labrador" }
              - { name: image, label: Photo, widget: image, required: false, hint: "Leave blank to use a stock photo, or upload one." }
          - name: faqs
            label: FAQs
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
      - name: quiz
        label: Class quiz
        file: src/data/quiz.json
        description: The "Which class is right for your dog?" quiz on the homepage. Each answer points at one or more classes; after the last question the class with the most points is suggested. Tick "Strong" on an answer that should nearly always decide the result (e.g. anxiety → 1-2-1).
        fields:
          - { name: eyebrow, label: Small label, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: intro, label: Intro text, widget: text }
          - name: questions
            label: Questions
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Question, widget: string }
              - name: options
                label: Answers
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Answer, widget: string, hint: "An emoji at the start looks nice, e.g. 🐣 Under 5 months" }
                  - name: recommends
                    label: Suggests these classes
                    widget: relation
                    collection: classes
                    value_field: "{{slug}}"
                    display_fields: [title]
                    search_fields: [title]
                    multiple: true
                  - { name: strong, label: Strong answer, widget: boolean, default: false }

  - name: classes
    label: Classes
    label_singular: Class
    description: Classes and courses shown on the Classes page, homepage and booking form.
    folder: src/content/classes
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { name: title, label: Class name, widget: string }
      - name: level
        label: Who it's for
        widget: select
        options:
          - { label: Puppy, value: puppy }
          - { label: Teenager, value: adolescent }
          - { label: Adult, value: adult }
          - { label: 1-2-1 / behaviour, value: behaviour }
      - { name: day, label: Day, widget: string, hint: "e.g. Saturday, or Flexible" }
      - { name: time, label: Time, widget: string, hint: "e.g. 10:00 – 10:45" }
      - { name: price, label: Price (£), widget: number, value_type: int }
      - { name: weeks, label: Number of weeks, widget: number, value_type: int, hint: "Use 1 for a single session." }
      - { name: spots, label: Spaces left, widget: number, value_type: int, hint: "3 or fewer shows a 'spaces left' badge." }
      - { name: image, label: Photo, widget: image, required: false, hint: "Leave blank to use a stock photo." }
      - { name: summary, label: Short summary, widget: text, hint: "One or two sentences shown on the class card." }
      - { name: featured, label: Show first, widget: boolean, default: false }
      - name: bookingUrl
        label: Online booking link
        widget: string
        required: false
        hint: "Paste a Stripe Payment Link or Calendly link and every Book button for this class will go there. Leave blank to use the enquiry form."
      - { name: body, label: Full description, widget: markdown }

  - name: pages
    label: Pages
    description: Text on the Home and About pages. The layout is fixed.
    folder: src/content/pages
    create: false
    delete: false
    format: frontmatter
    fields:
      - { name: title, label: Browser tab title, widget: string }
      - { name: heading, label: Section heading, widget: string }
      - { name: body, label: Content, widget: markdown }

  - name: posts
    label: News
    label_singular: Post
    description: News posts. New posts appear on the News page after publishing.
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    format: frontmatter
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - { name: summary, label: Summary, widget: string, required: false, hint: Shown on the News listing page. }
      - { name: image, label: Image, widget: image, required: false }
      - { name: body, label: Content, widget: markdown }
